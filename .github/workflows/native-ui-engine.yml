name: Native UI Engine
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.99.1 fmt --manifest-path native/png/Cargo.toml --check
      - run: cargo +1.99.1 test --locked --manifest-path native/png/Cargo.toml
      - run: cargo +1.99.1 clippy --locked --manifest-path native/png/Cargo.toml --all-targets -- -D warnings
      - run: python3 scripts/verify-native-png.py
  lint:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:swift
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify release runtime matches source
        run: git diff --exit-code -- runtime/native-ui-engine.js ios/Sources/WebViewNativeUIEngine/Resources/native-ui-engine.js
      - run: npm run test:controls
      - run: npm run test:release
      - run: npm run test:package
      - run: npx playwright install --with-deps chromium
      - run: npm test
  swift-package:
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Start simulator while dependencies build
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          echo "CORDOVA_SIMULATOR=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE" || true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build package tests
        run: xcodebuild -scheme WebViewNativeUIEngine-Package -destination "platform=iOS Simulator,id=$CORDOVA_SIMULATOR" -derivedDataPath "$RUNNER_TEMP/swift-package" CODE_SIGNING_ALLOWED=NO build-for-testing
      - name: Test deterministic views and native contracts
        timeout-minutes: 3
        run: |
          xcrun simctl bootstatus "$CORDOVA_SIMULATOR" -b
          # Real WebKit navigation and active presentations run with UIApplication in ios-integration.
          xcodebuild -scheme WebViewNativeUIEngine-Package \
            -destination "platform=iOS Simulator,id=$CORDOVA_SIMULATOR" \
            -derivedDataPath "$RUNNER_TEMP/swift-package" \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics never \
            -skip-testing:WebViewNativeUIEngineTests/NativeUIProjectionTests \
            -skip-testing:WebViewNativeUIEngineTests/NativeUIScrollTrackerTests \
            -skip-testing:WebViewNativeUIControlsTests/NativeUISnapshotTests/testNativePopoverClosureNotifiesWebBeforeReopening \
            -skip-testing:WebViewNativeUIControlsTests/NativeUISnapshotTests/testPopoverReopensAfterPresentationIdentityKeepsReplacedSource \
            -skip-testing:WebViewNativeUIControlsTests/NativeUISnapshotTests/testViewCapturePreservesNativeSourceOrder \
            -resultBundlePath "$RUNNER_TEMP/swift-package.xcresult" \
            CODE_SIGNING_ALLOWED=NO test-without-building
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: swift-package-failure
          path: ${{ runner.temp }}/swift-package.xcresult
          if-no-files-found: ignore
          retention-days: 7
  ios-integration:
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Start simulator while dependencies build
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          echo "CORDOVA_SIMULATOR=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE" || true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build hosted WebKit and presentation tests
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate --spec ios/Tests/project.yml
          xcodebuild -project ios/Tests/NativeUIControlsHostedTests.xcodeproj -scheme NativeUIHostedTests -destination "platform=iOS Simulator,id=$CORDOVA_SIMULATOR" -derivedDataPath "$RUNNER_TEMP/ios-hosted" CODE_SIGNING_ALLOWED=NO build-for-testing
      - name: Test WebKit and presentations with UIApplication
        timeout-minutes: 3
        run: |
          xcrun simctl bootstatus "$CORDOVA_SIMULATOR" -b
          xcodebuild -project ios/Tests/NativeUIControlsHostedTests.xcodeproj -scheme NativeUIHostedTests -destination "platform=iOS Simulator,id=$CORDOVA_SIMULATOR" -derivedDataPath "$RUNNER_TEMP/ios-hosted" -parallel-testing-enabled NO -collect-test-diagnostics never -resultBundlePath "$RUNNER_TEMP/ios-hosted.xcresult" CODE_SIGNING_ALLOWED=NO test-without-building
      - name: Verify capture-to-Web image reuse on a real simulator screen
        run: python3 scripts/verify-image-reuse.py --device "$CORDOVA_SIMULATOR"
      - name: Verify npm-distributed CocoaPod
        run: |
          set -euo pipefail
          ENGINE_PODS_TEMP=$(mktemp -d)
          trap 'rm -rf "$ENGINE_PODS_TEMP"' EXIT
          archive=$(npm pack . --ignore-scripts --json --pack-destination "$ENGINE_PODS_TEMP" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8"))[0].filename')
          mkdir -p "$ENGINE_PODS_TEMP/engine" "$ENGINE_PODS_TEMP/app"
          tar -xzf "$ENGINE_PODS_TEMP/$archive" --strip-components=1 -C "$ENGINE_PODS_TEMP/engine"
          cat > "$ENGINE_PODS_TEMP/app/Podfile" <<'RUBY'
          platform :ios, '15.0'
          install! 'cocoapods', :integrate_targets => false
          use_frameworks!
          target 'App' do
            pod 'WebViewNativeUIEngine', :path => '../engine'
            pod 'WebViewNativeUIControls', :path => '../engine'
          end
          RUBY
          pod install --project-directory="$ENGINE_PODS_TEMP/app"
          xcodebuild -project "$ENGINE_PODS_TEMP/app/Pods/Pods.xcodeproj" -scheme WebViewNativeUIControls -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - run: npm run test:cordova -- ios "$CORDOVA_SIMULATOR"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ios-hosted-failure
          path: ${{ runner.temp }}/ios-hosted.xcresult
          if-no-files-found: ignore
          retention-days: 7
  swift:
    # Keep the existing required check name, covering both parallel macOS jobs.
    if: always()
    needs: [swift-package, ios-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require both Swift suites
        env:
          PACKAGE_RESULT: ${{ needs.swift-package.result }}
          INTEGRATION_RESULT: ${{ needs.ios-integration.result }}
        run: test "$PACKAGE_RESULT" = success && test "$INTEGRATION_RESULT" = success
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: python3 scripts/native-ui-engine-release/verify.py
      - run: npm run lint:android
      - run: android/gradlew -p android :controls:testReleaseUnitTest :controls:lintRelease
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            android/gradlew -p android :connectedDebugAndroidTest
            npm run test:cordova -- android emulator-5554
      - name: Verify unsupported capture fallback on minimum Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 23
          arch: x86
          script: android/gradlew -p android :connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.github.webview_native_ui.engine.NativeUIEngineTest#unsupportedCaptureKeepsNativeViewOnApi23
