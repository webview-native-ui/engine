name: Native UI Engine
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  lint:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:swift
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify release runtime matches source
        run: git diff --exit-code -- runtime/native-ui-engine.js ios/Sources/WebViewNativeUIEngine/Resources/native-ui-engine.js
      - run: npm run test:release
      - run: npm run test:package
      - run: npx playwright install --with-deps chromium
      - run: npm test
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Test on an available iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          echo "CORDOVA_SIMULATOR=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -scheme WebViewNativeUIEngine -destination "platform=iOS Simulator,id=$DEVICE" CODE_SIGNING_ALLOWED=NO test
      - name: Verify npm-distributed CocoaPod
        run: |
          set -euo pipefail
          ENGINE_PODS_TEMP=$(mktemp -d)
          trap 'rm -rf "$ENGINE_PODS_TEMP"' EXIT
          archive=$(npm pack . --ignore-scripts --json --pack-destination "$ENGINE_PODS_TEMP" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8"))[0].filename')
          mkdir -p "$ENGINE_PODS_TEMP/engine" "$ENGINE_PODS_TEMP/app"
          tar -xzf "$ENGINE_PODS_TEMP/$archive" --strip-components=1 -C "$ENGINE_PODS_TEMP/engine"
          cat > "$ENGINE_PODS_TEMP/app/Podfile" <<'RUBY'
          platform :ios, '15.0'
          install! 'cocoapods', :integrate_targets => false
          use_frameworks!
          target 'App' do
            pod 'WebViewNativeUIEngine', :path => '../engine'
          end
          RUBY
          pod install --project-directory="$ENGINE_PODS_TEMP/app"
          xcodebuild -project "$ENGINE_PODS_TEMP/app/Pods/Pods.xcodeproj" -scheme WebViewNativeUIEngine -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - run: npm run test:cordova -- ios "$CORDOVA_SIMULATOR"
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: python3 scripts/native-ui-engine-release/verify.py
      - run: npm run lint:android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            android/gradlew -p android connectedDebugAndroidTest
            npm run test:cordova -- android emulator-5554
      - name: Verify unsupported capture fallback on minimum Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 23
          arch: x86
          script: android/gradlew -p android connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.github.webview_native_ui.engine.NativeUIEngineTest#unsupportedCaptureKeepsNativeViewOnApi23
