name: Native UI Engine Maven Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Publish this package.json version to Maven Central (immutable)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-ui-engine-maven-release
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require the tested release tag and explicit version
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        with:
          script: |
            const { verifyReleaseTag } = await import(`${process.cwd()}/scripts/native-ui-engine-release/release-tag.mjs`);
            const { sha, version } = verifyReleaseTag(context.ref.replace('refs/tags/', ''));
            if (version !== process.env.RELEASE_VERSION) throw new Error('Version must match the release tag');
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo, workflow_id: 'native-ui-engine.yml', head_sha: sha,
              event: 'push', branch: `v${version}`, per_page: 100,
            });
            const latest = runs.sort((a, b) => b.run_number - a.run_number)[0];
            if (!latest || latest.status !== 'completed' || latest.conclusion !== 'success') {
              throw new Error('This exact release commit must pass Native UI Engine CI first');
            }
      - name: Refuse an existing coordinate
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "https://repo.maven.apache.org/maven2/io/github/webview-native-ui/engine/$RELEASE_VERSION/engine-$RELEASE_VERSION.pom")
          test "$code" = 404 || { echo "Central returned HTTP $code; refusing publication"; exit 1; }
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: npm ci
      - run: node --test scripts/native-ui-engine-release/publish.test.mjs
      - name: Build the signed bundle
        env:
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: android/gradlew -p android --no-daemon -PsignRelease clean centralBundle --console=plain
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-central-bundle
          path: android/build/distributions/*.zip
          if-no-files-found: error
      - name: Upload and wait for Central publishing acceptance
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const { readFile } = await import('node:fs/promises');
            const { pathToFileURL } = await import('node:url');
            const { publishBundle } = await import(pathToFileURL(`${process.cwd()}/scripts/native-ui-engine-release/publish.mjs`));
            const { CENTRAL_USERNAME, CENTRAL_PASSWORD } = process.env;
            if (!CENTRAL_USERNAME || !CENTRAL_PASSWORD) throw new Error('Central user token secrets are required');
            const version = JSON.parse(await readFile('package.json', 'utf8')).version;
            const name = `engine-${version}`;
            const token = Buffer.from(`${CENTRAL_USERNAME}:${CENTRAL_PASSWORD}`).toString('base64');
            core.setSecret(token);
            await publishBundle({
              bundle: await readFile(`android/build/distributions/${name}-central.zip`),
              name,
              token,
              record: async message => {
                core.info(message);
                await core.summary.addRaw(`${message}\n`).write();
              },
            });
