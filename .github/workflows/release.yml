name: Release
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  npm:
    runs-on: ubuntu-latest
    concurrency:
      group: engine-npm-release
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify release identity and tested commit
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        with:
          script: |
            const { readFileSync } = await import('node:fs');
            const { execFileSync } = await import('node:child_process');
            const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
            if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version) || process.env.RELEASE_TAG !== `v${version}`) throw new Error('Tag must match package version');
            const sha = execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim();
            execFileSync('git', ['merge-base', '--is-ancestor', sha, 'origin/main']);
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo, workflow_id: 'native-ui-engine.yml', head_sha: sha, event: 'push', branch: 'main', per_page: 100,
            });
            const latest = runs.sort((a,b) => b.run_number-a.run_number)[0];
            if (!latest || latest.status !== 'completed' || latest.conclusion !== 'success') throw new Error('Exact release commit must pass CI');
      - name: Verify Maven availability
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for EXTENSION in pom aar; do
            curl --fail --silent --show-error --head --max-time 30 "https://repo.maven.apache.org/maven2/io/github/rdlabo/native-ui-engine/$VERSION/native-ui-engine-$VERSION.$EXTENSION"
          done
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm run test:package
      - name: Publish npm
        run: |
          TAG=$(node -p "require('./package.json').version.includes('-') ? 'next' : 'latest'")
          npm publish --provenance --access public --tag "$TAG"
