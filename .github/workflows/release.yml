name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify and publish
        required: true
        type: string
permissions:
  contents: read
jobs:
  npm:
    runs-on: ubuntu-latest
    concurrency:
      group: engine-npm-release
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify release identity and tested commit
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        with:
          script: |
            const { readFileSync } = await import('node:fs');
            const { execFileSync } = await import('node:child_process');
            const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
            if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version) || process.env.RELEASE_TAG !== `v${version}`) throw new Error('Tag must match package version');
            const sha = execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim();
            execFileSync('git', ['merge-base', '--is-ancestor', sha, 'origin/main']);
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo, workflow_id: 'native-ui-engine.yml', head_sha: sha, event: 'push', branch: process.env.RELEASE_TAG, per_page: 100,
            });
            const latest = runs.sort((a,b) => b.run_number-a.run_number)[0];
            if (!latest || latest.status !== 'completed' || latest.conclusion !== 'success') throw new Error('Exact release commit must pass CI');
      - name: Verify Maven publication acceptance
        uses: actions/github-script@v8
        with:
          script: |
            const { execFileSync } = await import('node:child_process');
            const sha = execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim();
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo, workflow_id: 'native-ui-engine-release.yml', head_sha: sha,
              event: 'workflow_dispatch', branch: `v${JSON.parse((await import('node:fs')).readFileSync('package.json', 'utf8')).version}`, per_page: 100,
            });
            const accepted = runs.find(run => run.status === 'completed' && run.conclusion === 'success');
            if (!accepted) throw new Error('Exact release commit must have a successful Maven publication workflow');
            core.info(`Maven publication accepted: ${accepted.html_url}. Central distribution may still be pending.`);
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- runtime/native-ui-engine.js ios/Sources/WebViewNativeUIEngine/Resources/native-ui-engine.js
      - run: npm run test:package
      - run: node --test scripts/native-ui-engine-release/npm-artifact.test.mjs
      - name: Check existing npm artifact
        id: artifact
        uses: actions/github-script@v8
        with:
          script: |
            const { readFileSync } = await import('node:fs');
            const { execFileSync } = await import('node:child_process');
            const { pathToFileURL } = await import('node:url');
            const { existingArtifactMatches } = await import(pathToFileURL(`${process.cwd()}/scripts/native-ui-engine-release/npm-artifact.mjs`));
            const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
            const [packed] = JSON.parse(execFileSync('npm', ['pack', '--json'], { encoding: 'utf8' }));
            const exists = await existingArtifactMatches({ name, version, local: readFileSync(packed.filename) });
            core.info(exists ? 'Identical npm package already published; skipping upload' : 'npm version is available');
            core.setOutput('exists', exists);
      - name: Publish npm
        if: steps.artifact.outputs.exists != 'true'
        run: |
          TAG=$(node -p "require('./package.json').version.includes('-') ? 'next' : 'latest'")
          npm publish --provenance --access public --tag "$TAG"
